name: deploy.yml

on:
  push:
    branches:
      - release
  workflow_dispatch:

#https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
#Node 20 is being deprecated.
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setting AWS CLI
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      #      https://github.com/aws-actions/amazon-ecr-login
      - name: Login ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      #buildx에 provenance나 캐시옵션을 추가하면 cd 빌드 단축 가능
      #--cache-from / --cache-to type=gha
      - name: Build and push Docker image
        run: |
          ECR_URI="${{ vars.ECR_REPOSITORY_URI }}"

          docker buildx build \
            -t "$ECR_URI:${{ github.sha }}" \
            -t "$ECR_URI:latest" \
            --push \
            .

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Setting AWS CLI
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      #https://docs.aws.amazon.com/cli/latest/reference/ecs/
      #https://github.com/aws-actions/amazon-ecs-deploy-task-definition
      - name: Update ECS Task Definition
        run: |
          ECR_URI="${{ vars.ECR_REPOSITORY_URI }}"
          
          TASK_DEFINITION=$(aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_DEFINITION }}")
          
          NEW_TASK_DEFINITION=$(echo "$TASK_DEFINITION" | jq \
            --arg IMAGE "$ECR_URI:latest" \
            '.taskDefinition
            | .containerDefinitions[0].image = $IMAGE
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )')
          
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEFINITION" | jq -r '.taskDefinition.taskDefinitionArn')

          echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> "$GITHUB_ENV"

      - name: Stop ECS Service
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --desired-count 0

      #      #현재 ecs가 롤링 업데이트를 쓰고 있지만 기존 태스크를 내리기 위해서 사용
      #      - name: Waiting for ECS Service stable
      #        run: |
      #          aws ecs wait services-stable \
      #            --cluster "${{ vars.ECS_CLUSTER }}" \
      #            --services "${{ vars.ECS_SERVICE }}"

      - name: Update ECS Service
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --desired-count 1 \
            --force-new-deployment