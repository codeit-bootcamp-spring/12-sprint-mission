plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.0'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'jacoco'
}

group = 'com.sprint.mission'
version = '1.2-M8'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.postgresql:postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'
	// MapStruct: 컴파일 타임에 매퍼 구현체를 자동 생성하여 보일러플레이트 제거
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	// Lombok + MapStruct 함께 사용 시 lombok이 먼저 처리되도록 순서 필요
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'software.amazon.awssdk:s3:2.31.7'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

// 레거시 File/JCF 구현체와 JavaApplication은 현재 JPA 기반 인터페이스와 호환되지 않아 제외
sourceSets.main.java.exclude(
    'com/sprint/mission/discodeit/repository/file/**',
    'com/sprint/mission/discodeit/repository/jcf/**',
    'com/sprint/mission/discodeit/service/file/**',
    'com/sprint/mission/discodeit/service/jcf/**',
    'com/sprint/mission/discodeit/JavaApplication.java'
)
