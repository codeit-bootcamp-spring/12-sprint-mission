<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 목록</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="bg-glow"></div>
<main class="page">
    <header class="dashboard-header">
        <h1 class="page-title">커뮤니티 멤버</h1>
        <div class="stats-container">
            <div class="stat-card">
                <span class="stat-label">전체 멤버</span>
                <span class="stat-value" id="totalCount">-</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">현재 온라인</span>
                <span class="stat-value online" id="onlineCount">-</span>
            </div>
        </div>
    </header>

    <div class="controls-bar">
        <div class="search-wrapper">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="이름 또는 이메일로 검색..." autocomplete="off">
        </div>
        <div class="sort-wrapper">
            <select id="sortSelect">
                <option value="none">정렬: 기본</option>
                <option value="name">이름순</option>
                <option value="status">온라인 우선</option>
            </select>
        </div>
    </div>

    <section class="user-list" id="userList" aria-live="polite">
        <!-- Content will be injected by script.js -->
    </section>
</main>
<script src="./script.js"></script>
</body>
</html>
