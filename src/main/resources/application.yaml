spring:
  application:
    name: discodeit
  servlet:
    multipart:
      maxFileSize: 10MB # 파일 하나의 최대 크기
      maxRequestSize: 30MB  # 한 번에 최대 업로드 가능 용량

  profiles:
    active: dev

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

discodeit:
  storage:
    type: local
    local:
      root-path: .discodeit/storage

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
  info:
    env:
      enabled: true
    build:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: Discodeit
    version: 1.7.0
  config:
    datasource:
      url: "${spring.datasource.url}"
      driver-class-name: "${spring.datasource.driver-class-name}"
    jpa:
      ddl-auto: "${spring.jpa.hibernate.ddl-auto}"
    storage:
      type: "${storage.type}"
      path: "${storage.path}"
    multipart:
      max-file: "${spring.servlet.multipart.max-file-size}"
      max-request: "${spring.servlet.multipart.max-request-size}"