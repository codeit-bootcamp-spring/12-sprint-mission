spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: discodeit
  profiles:
    active: dev
  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 30MB
  jpa:
    open-in-view: false


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  info:
    env:
      enabled: true

info:
  app:
    name: Discodeit
    version: 2.1-M10
    java-version: "17"
    spring-boot-version: "3.4.0"

discodeit:
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@discodeit.com}
    password: ${ADMIN_PASSWORD:admin1234}
  security:
    jwt:
      # HS256 서명 키. 32바이트 미만이면 기동에 실패한다
      secret: ${JWT_SECRET:discodeit-jwt-secret-key-change-me-in-production}
      access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:1800}          # 30분
      refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:1209600}     # 14일
      # 계정당 동시 로그인 허용 수. 초과하면 가장 오래된 로그인을 무효화한다
      max-active-count: ${JWT_MAX_ACTIVE_COUNT:1}
      # 운영(HTTPS)에서는 true로 켠다
      cookie-secure: ${JWT_COOKIE_SECURE:false}
  storage:
    type: ${STORAGE_TYPE:local}                              # local | s3 (기본 local)
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}   # 초 단위, 기본 10분

logging:
  level:
    root: info
