springdoc:
  swagger-ui:
    path: /swagger-ui.html          # 접속 URL
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    try-it-out-enabled: true
  api-docs:
    path: /api-docs                # JSON 스펙 URL

    spring:
      application:
        name: discodeit

    logging:
      level:
        org.springframework.web.servlet.DispatcherServlet: DEBUG  #