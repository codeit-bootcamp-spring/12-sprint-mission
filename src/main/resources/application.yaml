spring:
  application:
    name: discodeit

  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 30MB

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
level:
  org.hibernate.SQL: debug
  org.hibernate.orm.jdbc.bind: trace