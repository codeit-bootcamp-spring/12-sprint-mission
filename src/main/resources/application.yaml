spring:
  application:
    name: discodeit
    version: 1.7.0
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}   # dev, prod 선택 가능
  servlet:
    multipart:
      maxFileSize: 100MB # 파일 하나의 최대 크기
      maxRequestSize: 300MB  # 한 번에 최대 업로드 가능 용량

  jpa:
    hibernate:
      ddl-auto: none  # none, create, create-drop, update, validate
    properties:
      hibernate:
        highlight_sql: true
        format_sql: true
        use_sql_comments: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        jdbc.time_zone: UTC
        open-in-view: false

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    persist-authorization: true

logging:
  level:
    root: info
    # Hibernate SQL
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: trace
    org.hibernate.type.descriptor.sql: trace
    # Spring Web
    org.springframework.web: trace
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.springframework.security: trace

  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"
discodeit:
  admin:
    username: admin
    email: admin@discodeit.com
    password: admin
  storage:
    type: ${STORAGE_TYPE:local}  # local | s3 (기본값: local)
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600} # (기본값: 10분)

security:
  jwt:
    issuer: discodeit
    secret: ${JWT_SECRET}  # 32char 이상 길게 써줘야함!!
    access-token-validity-seconds: 3600 # 1시간
    #    access-token-validity-seconds: 10 # 10초
    refresh-token-validity-seconds: 86400 # 1일
    max-active-count: 1 # 계정당 동시 활성 JWT 세션 수

# actuator/info 에 노출할 정보
info:
  app:
    name: ${spring.application.name}
    version: ${spring.application.version:1.0.0}
    spring: ${spring.version}
  runtime:
    profile: ${spring.profiles.active}
    java: ${java.runtime.version}
    jvmVendor: ${java.vendor}
  database:
    url: ${spring.datasource.url}
    driver: ${spring.datasource.driver-class-name}
    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto}
    storage:
      type: ${discodeit.storage.type}
      path: ${discodeit.storage.root-path}
    multipart:
      max-file-size: ${spring.servlet.multipart.maxFileSize}
      max-request-size: ${spring.servlet.multipart.maxRequestSize}


# Actuator 노출 범위
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,threaddump,heapdump,users
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true   # liveness/readiness
  info:
    env:
      enabled: true     # info.* 노출
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true