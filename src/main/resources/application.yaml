spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: discodeit
  profiles:
    active: dev
  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 30MB
  jpa:
    open-in-view: false


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  info:
    env:
      enabled: true
  # @Timed, @Counted 같은 관측 어노테이션을 활성화한다 (기본값 false)
  observations:
    annotations:
      enabled: true

info:
  app:
    name: Discodeit
    version: 2.2-M11
    java-version: "17"
    spring-boot-version: "3.4.0"

discodeit:
  # 아래 값들은 기본값을 두지 않는다.
  # fallback이 있으면 환경변수 주입을 빠뜨려도 예측 가능한 자격증명으로 조용히 기동해버리므로,
  # 주입 누락 시 곧바로 기동에 실패하도록 한다(fail-fast). 로컬 개발값은 dev 프로파일에 둔다.
  admin:
    username: ${ADMIN_USERNAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  security:
    jwt:
      # HS256 서명 키. 32바이트 미만이면 기동에 실패한다.
      # 키가 저장소에 있으면 누구나 토큰을 위조할 수 있으므로 기본값을 두지 않는다.
      secret: ${JWT_SECRET}
      access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:1800}          # 30분
      refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:1209600}     # 14일
      # 계정당 동시 로그인 허용 수. 초과하면 가장 오래된 로그인을 무효화한다
      max-active-count: ${JWT_MAX_ACTIVE_COUNT:1}
      # 로테이션 직후 직전 리프레시 토큰을 인정하는 유예 창.
      # 탭 여러 개가 동시에 재발급을 요청하는 정상 상황과 탈취 후 재사용을 구분하기 위한 값으로,
      # 길수록 탈취된 토큰이 살아있는 시간이 늘어나므로 짧게 둔다.
      refresh-grace-seconds: ${JWT_REFRESH_GRACE_SECONDS:10}
      # 운영(HTTPS)에서는 true로 켠다
      cookie-secure: ${JWT_COOKIE_SECURE:false}
  storage:
    type: ${STORAGE_TYPE:local}                              # local | s3 (기본 local)
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}   # 초 단위, 기본 10분

logging:
  level:
    root: info
