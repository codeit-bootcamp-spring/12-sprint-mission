<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 등록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1>회원 등록</h1>

<form class="myform" th:action="@{/users}" method="post">
    <label>아이디: <input type="text"     name="username" required/></label><br/><br/>
    <label>비밀번호: <input type="password" name="password" required/></label><br/><br/>
    <label>이름:   <input type="text"     name="name"     required/></label><br/><br/>
    <button type="submit">등록</button>
    <a class="btn" th:href="@{/users}">취소</a>
</form>

</body>
</html>
