spring:
  datasource:
    url: jdbc:postgresql://prod-db:5432/prod_db
    username: prod_user
    password: prod_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate


    logging:
      level:
        root: INFO
        com.sprint.mission.discodeit: INFO
        org.hibernate.SQL: DEBUG
server:
  port: 8080