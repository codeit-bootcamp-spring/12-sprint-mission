spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://192.168.1.140:54320/discodeit
    driver-class-name: org.postgresql.Driver
    username: discodeit_user
    password: discodeit1234
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_CLIENT_URL:http://localhost:9090}
        enabled: true
        instance:
          name: discodeit-prod
          service-url: ${SPRING_BOOT_ADMIN_SERVICE_URL:http://localhost:8080}

logging:
  level:
    root: info
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off
    org.springframework.web: info
