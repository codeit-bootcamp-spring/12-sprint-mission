server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    # 요청마다 통과하는 시큐리티 필터 목록을 확인하기 위해 trace로 설정
    org.springframework.security: trace

info:
  config:
    datasource:
      url: jdbc:postgresql://localhost:5432/discodeit
      driver-class-name: org.postgresql.Driver
    jpa:
      ddl-auto: update
    storage:
      type: local
      path: .discodeit/storage
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

# 로컬 전용 값. 운영에서는 base(application.yaml)의 기본값 없는 플레이스홀더가 적용된다
discodeit:
  admin:
    username: admin
    email: admin@discodeit.com
    password: admin1234
  security:
    jwt:
      secret: dev-only-jwt-secret-key-do-not-use-in-production
